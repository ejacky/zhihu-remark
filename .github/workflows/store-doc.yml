name: sync store doc

# 打 v* tag 时把 docs/STORE.md 的「自动生成区」同步到 manifest.json 的当前版本。
# 只改这一份文档，不改代码、不发版；没有差异时不提交。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 同步 STORE.md
        run: node scripts/sync-store.mjs

      - name: 有差异则提交
        run: |
          if [ -z "$(git status --porcelain docs/STORE.md)" ]; then
            echo "STORE.md 已是最新，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STORE.md
          git commit -m "docs(store): 随 ${GITHUB_REF_NAME} 同步版本与权限清单"
          git push origin HEAD:main
