<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知乎反驳助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>🛡️ 知乎反驳助手</h1>
      <p>识别错误，理性反驳</p>
    </header>

    <main class="popup-body">
      <!-- 状态卡片 -->
      <div class="status-card" id="statusCard">
        <div class="status-icon" id="statusIcon">⚠️</div>
        <div class="status-info">
          <div class="status-title" id="statusTitle">未配置 API</div>
          <div class="status-desc" id="statusDesc">点击"详细设置"配置 API Key</div>
        </div>
      </div>

      <!-- 快捷操作 -->
      <div class="quick-actions">
        <button class="action-btn" id="btnOptions">
          <span class="action-icon">⚙️</span>
          <span>详细设置</span>
        </button>
        <button class="action-btn" id="btnHistory">
          <span class="action-icon">📜</span>
          <span>历史记录</span>
        </button>
      </div>

      <!-- 最近记录 -->
      <div class="recent-section" id="recentSection" style="display: none;">
        <h3>最近生成</h3>
        <div class="recent-list" id="recentList"></div>
      </div>
    </main>

    <footer class="popup-footer">
      <span>v1.0.0</span>
      <a href="#" id="linkHelp">使用帮助</a>
    </footer>
  </div>
  <script src="../shared/constants.js"></script>
  <script src="index.js"></script>
</body>
</html>
