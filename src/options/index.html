<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知乎反驳助手 - 设置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="options-container">
    <header class="options-header">
      <h1>🛡️ 知乎反驳助手</h1>
      <p>填好 API Key 和模型就能用，其余都有默认值</p>
    </header>

    <main class="options-content">
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
        <span class="form-hint">只存在本机，不会上传到任何服务器</span>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label for="model">模型</label>
          <button type="button" class="btn btn--link btn--small" id="btnSyncModels">同步模型</button>
        </div>
        <input type="text" id="model" list="modelOptions" placeholder="点「同步模型」拉取，或直接输入模型名" autocomplete="off">
        <datalist id="modelOptions"></datalist>
        <span class="form-hint" id="modelHint" aria-live="polite">点「同步模型」从服务商拉取列表，或直接输入模型名</span>
      </div>

      <label class="toggle-item">
        <div class="toggle-info">
          <div class="toggle-title">深度思考</div>
          <div class="toggle-desc">先推理再作答，质量更好但每次 30~50 秒；关闭则 1~3 秒出结果</div>
        </div>
        <input type="checkbox" id="thinking" class="toggle-switch" checked>
        <span class="toggle-slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-info">
          <div class="toggle-title">保存历史记录</div>
          <div class="toggle-desc">保留最近 10 条生成结果，只存本机</div>
        </div>
        <input type="checkbox" id="enableHistory" class="toggle-switch" checked>
        <span class="toggle-slider"></span>
      </label>

      <details class="options-advanced">
        <summary>高级设置（一般不用改）</summary>

        <div class="form-group">
          <label>AI 提供商</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="provider" value="deepseek" checked>
              <span>DeepSeek</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="provider" value="kimi">
              <span>Kimi</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="provider" value="opencode-go">
              <span>OpenCode Go</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="provider" value="openai">
              <span>OpenAI</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="provider" value="anthropic">
              <span>Claude</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="provider" value="custom">
              <span>自定义</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="apiBase">API Base URL</label>
          <div class="builtin-base" id="builtinBaseRow" hidden>
            <code id="builtinBaseValue"></code>
            <label class="builtin-base__override">
              <input type="checkbox" id="apiBaseOverride">
              <span>使用自定义地址</span>
            </label>
          </div>
          <input type="text" id="apiBase" placeholder="https://api.example.com/v1" autocomplete="off" hidden>
          <span class="form-hint" id="apiBaseHint">留空使用该提供商的内置地址；也可填代理 / 镜像地址</span>
        </div>

        <div class="form-group">
          <label for="style">反驳风格</label>
          <select id="style">
            <option value="gentle">温和理性</option>
            <option value="direct">直接犀利</option>
            <option value="academic">学术严谨</option>
            <option value="natural">自然真实</option>
          </select>
        </div>

        <div class="form-group">
          <label for="customPromptSuffix">自定义 Prompt 后缀</label>
          <textarea id="customPromptSuffix" rows="3" placeholder="例如：对历史话题，必须同时考虑政治、经济、军事三个维度。"></textarea>
          <span class="form-hint">留空则不追加任何内容</span>
        </div>
      </details>

      <div class="panel-title" style="margin-top: 32px;">
        <h2>生成历史</h2>
        <p>最近 10 条，只存本机</p>
      </div>
      <div class="history-toolbar">
        <button class="btn btn--danger" id="btnClearHistory">清空历史</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">暂无历史记录</div>
      </div>
    </main>

    <footer class="options-footer">
      <div class="save-status" id="saveStatus"></div>
      <button class="btn btn--primary" id="btnSave">保存设置</button>
    </footer>
  </div>
  <script src="../shared/constants.js"></script>
  <script src="../shared/permissions.js"></script>
  <script src="models.js"></script>
  <script src="index.js"></script>
</body>
</html>
